
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.tailwindcss.com"></script>
  <title>Revenue Dashboard Card</title>
</head>
<body class="min-h-screen bg-slate-100 p-6 flex items-center justify-center font-sans">

  <article class="w-full max-w-md rounded-2xl border border-slate-200
    bg-white p-6 shadow-sm transition hover:shadow-lg">

    <div class="flex items-start justify-between gap-4">
      <div>
        <p class="text-sm font-medium text-slate-500">Total Revenue</p>
        <h2 id="revenue" class="mt-2 text-3xl font-bold tracking-tight
          text-slate-900">R$ 48.294,00</h2>
        <p class="mt-2 text-sm">
          <span class="font-semibold text-emerald-600">↑ 12.8%</span>
          <span class="text-slate-500"> vs. previous period</span>
        </p>
      </div>

      <div class="rounded-xl bg-emerald-50 p-3 text-emerald-600">
        <svg width="26" height="26" fill="none" viewBox="0 0 24 24"
          stroke="currentColor" stroke-width="1.8">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M3 7h18M5 4h14a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Zm10 10h3"/>
        </svg>
      </div>
    </div>

    <div class="mt-8 flex items-center justify-between">
      <h3 class="text-sm font-semibold text-slate-700">
        Revenue overview
      </h3>
      <select id="period" aria-label="Select date range"
        class="rounded-lg border border-slate-200 bg-white px-3 py-2
        text-sm text-slate-600 outline-none focus:ring-2
        focus:ring-emerald-500">
        <option value="7">Last 7 days</option>
        <option value="30">Last 30 days</option>
        <option value="90">Last 90 days</option>
      </select>
    </div>

    <div class="mt-5">
      <svg id="chart" viewBox="0 0 320 120"
        class="h-32 w-full overflow-visible"
        role="img" aria-label="Revenue trend chart">
        <defs>
          <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#10b981" stop-opacity=".25"/>
            <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
          </linearGradient>
        </defs>
        <g stroke="#e2e8f0" stroke-dasharray="4 4">
          <path d="M0 20H320 M0 50H320 M0 80H320 M0 110H320"/>
        </g>
        <path id="areaPath" fill="url(#area)"
          d="M0 90 L45 70 L90 80 L135 42 L180 58
             L225 28 L270 40 L320 10 L320 110 L0 110 Z"/>
        <path id="linePath" fill="none" stroke="#10b981"
          stroke-width="3" stroke-linecap="round" stroke-linejoin="round"
          d="M0 90 L45 70 L90 80 L135 42 L180 58
             L225 28 L270 40 L320 10"/>
        <circle id="chartDot" cx="320" cy="10" r="4"
          fill="#10b981" stroke="white" stroke-width="2"/>
      </svg>
      <div id="chartLabels"
        class="mt-2 flex justify-between text-xs text-slate-400">
        <span>Mon</span><span>Tue</span><span>Wed</span>
        <span>Thu</span><span>Fri</span><span>Sat</span><span>Sun</span>
      </div>
    </div>

    <div id="details" class="mt-5 hidden space-y-3 rounded-xl
      bg-slate-50 p-4 text-sm">
      <div class="flex justify-between">
        <span class="text-slate-500">Orders completed</span>
        <strong>1,284</strong>
      </div>
      <div class="flex justify-between">
        <span class="text-slate-500">Average order value</span>
        <strong>R$ 37.61</strong>
      </div>
      <div class="flex justify-between">
        <span class="text-slate-500">Conversion rate</span>
        <strong>4.6%</strong>
      </div>
    </div>

    <div class="mt-6 flex gap-3 border-t border-slate-100 pt-5">
      <button id="detailsBtn"
        class="flex-1 rounded-xl border border-slate-200 px-4 py-3
        text-sm font-semibold text-slate-700 transition
        hover:bg-slate-50 focus:outline-none focus:ring-2
        focus:ring-emerald-500">
        View details
      </button>
      <button id="reportBtn"
        class="flex-1 rounded-xl bg-emerald-600 px-4 py-3
        text-sm font-semibold text-white transition
        hover:bg-emerald-700 focus:outline-none focus:ring-2
        focus:ring-emerald-500 focus:ring-offset-2">
        Explore report ↗
      </button>
    </div>

    <p class="mt-4 text-xs text-slate-400">
      Sample metrics · Dashboard overview
    </p>
  </article>

  <script>
    const period = document.getElementById("period");
    const revenue = document.getElementById("revenue");
    const linePath = document.getElementById("linePath");
    const areaPath = document.getElementById("areaPath");
    const chartDot = document.getElementById("chartDot");
    const chartLabels = document.getElementById("chartLabels");
    const details = document.getElementById("details");
    const detailsBtn = document.getElementById("detailsBtn");

    const datasets = {
      7: {
        revenue: 48294,
        points: [90, 70, 80, 42, 58, 28, 40, 10],
        labels: ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"]
      },
      30: {
        revenue: 68420,
        points: [95, 75, 82, 58, 62, 35, 30, 10],
        labels: ["Week 1", "Week 2", "Week 3", "Week 4"]
      },
      90: {
        revenue: 192650,
        points: [100, 85, 62, 72, 45, 52, 23, 10],
        labels: ["Month 1", "Month 2", "Month 3"]
      }
    };

    function updateChart() {
      const data = datasets[period.value];
      revenue.textContent = data.revenue.toLocaleString("pt-BR", {
        style: "currency",
        currency: "BRL"
      });

      const points = data.points.map((y, i) =>
        `${i * (320 / (data.points.length - 1))} ${y}`
      );

      const line = "M" + points.join(" L");
      linePath.setAttribute("d", line);
      areaPath.setAttribute("d", line + " L320 110 L0 110 Z");

      chartDot.setAttribute("cx", 320);
      chartDot.setAttribute("cy", data.points[data.points.length - 1]);

      chartLabels.replaceChildren(
        ...data.labels.map(label => {
          const span = document.createElement("span");
          span.textContent = label;
          return span;
        })
      );
    }

    period.addEventListener("change", updateChart);

    detailsBtn.addEventListener("click", () => {
      const isHidden = details.classList.toggle("hidden");
      detailsBtn.textContent = isHidden ? "View details" : "Hide details";
    });

    document.getElementById("reportBtn").addEventListener("click", () => {
      alert("Report selected: Last " + period.value +
        " days. Connect your reporting page or API here.");
    });

    updateChart();
  </script>
</body>
</html>
